<!DOCTYPE html>

<html lang="vi">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>CSVC System</title>

    <style>
        :root {
            --primary: #2b6cb0;
            --bg: #f4f7fb;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, Segoe UI, Arial;
            background: linear-gradient(135deg, #f4f7fb, #e9f1fb);
            color: #1f2937;
            overflow: hidden;
        }

        body.hidden {
            display: none;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 720px;
            padding: 20px;
        }

        .logo {
            font-size: 42px;
            font-weight: 700;
            color: var(--primary);
            opacity: 0;
            transform: translateY(20px);
            animation: logoIn 1.2s ease forwards;
        }

        .subtitle {
            font-size: 18px;
            margin-top: 10px;
            color: #4b5563;
            opacity: 0;
            animation: fadeIn 1.5s forwards 0.5s;
        }

        .loading {
            margin-top: 40px;
            font-size: 14px;
            color: #6b7280;
        }

        .progress {
            width: 100%;
            height: 8px;
            margin-top: 14px;
            background: var(--border);
            border-radius: 20px;
            overflow: hidden;
        }

        .bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), #3b82f6);
            animation: load 3s linear forwards;
        }

        @keyframes logoIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes load {
            to {
                width: 100%;
            }
        }

        .fadeout {
            animation: fadeOut 0.8s forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: scale(1.05);
            }
        }
    </style>

</head>

<body>

    <canvas id="bg"></canvas>

    <div class="container">
        <div class="logo">CSVC SYSTEM</div>
        <div class="subtitle">Hệ thống quản lý cơ sở vật chất</div>

        ```
        <div class="loading">Đang khởi động hệ thống...</div>

        <div class="progress">
            <div class="bar"></div>
        </div>
        ```

    </div>

    <script>
        // =========================
        // SMART LOADING CHECK
        // =========================

        if (localStorage.getItem("csvc_visited")) {
            document.body.classList.add("hidden");
            window.location.href = "/guest/campus";
        }

        const startTime = Date.now();

        // =========================
        // PARTICLES
        // =========================

        const canvas = document.getElementById("bg");
        const ctx = canvas.getContext("2d");

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        resize();
        window.addEventListener("resize", resize);

        let particles = [];

        const count = window.innerWidth < 768 ? 50 : 100;

        for (let i = 0; i < count; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 2,
                dx: (Math.random() - 0.5) * 0.3,
                dy: (Math.random() - 0.5) * 0.3
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.x += p.dx;
                p.y += p.dy;

                if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.dy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(43,108,176,0.35)";
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }

        animate();

        // =========================
        // SMART REDIRECT
        // =========================

        function finishLoading() {
            const elapsed = Date.now() - startTime;
            const minTime = 3000;

            const wait = Math.max(0, minTime - elapsed);

            setTimeout(() => {
                document.body.classList.add("fadeout");

                setTimeout(() => {
                    localStorage.setItem("csvc_visited", "1");
                    window.location.href = "/guest/campus";
                }, 800);

            }, wait);
        }

        // giả lập load hệ thống (có thể thay bằng API thật)
        window.addEventListener("load", finishLoading);

    </script>

</body>

</html>
